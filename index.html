<!DOCTYPE html>

<head>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #020c07;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Immersive Full-Screen Container */
        .profile-card {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 920px;
            background: radial-gradient(circle at 50% 25%, #0b3826 0%, #041c12 55%, #010a05 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.95), inset 0 0 40px rgba(16, 185, 129, 0.15);
            overflow: hidden;
            border: 1px solid rgba(234, 179, 8, 0.35);
            border-radius: 28px;
        }

        /* Header / Profile Badge */
        .brand-header {
            position: absolute;
            top: 24px;
            z-index: 30;
            display: flex;
            align-items: center;
            background: rgba(4, 20, 13, 0.88);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(234, 179, 8, 0.6);
            border-radius: 50px;
            padding: 6px 22px 6px 6px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
        }

        .profile-pic {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #eab308;
            object-fit: cover;
            margin-right: 12px;
        }

        .brand-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Graphics Stage */
        .graphics-stage {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 50px;
        }

        .main-svg-art {
            width: 100%;
            height: 100%;
            max-height: 580px;
        }

        /* Clickable Social Media Bubbles positioned precisely along the natural arc */
        .social-bubble {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(4, 20, 13, 0.95);
            border: 1.5px solid rgba(234, 179, 8, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.85);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            z-index: 25;
        }

        .social-bubble svg {
            width: 52%;
            height: 52%;
            transition: transform 0.3s ease;
        }

        .social-bubble:hover {
            transform: scale(1.25) translateY(-3px);
            border-color: #facc15;
            background: rgba(234, 179, 8, 0.3);
            box-shadow: 0 0 28px rgba(250, 204, 21, 0.85);
        }

        .social-bubble:hover svg {
            transform: scale(1.1);
        }

        /* Organic coordinates mapping */
        .bubble-fb { top: 31%; left: 37%; animation: floatItem 3.2s ease-in-out infinite; }
        .bubble-ig { top: 38%; left: 57%; animation: floatItem 3.6s ease-in-out infinite 0.4s; }
        .bubble-tk { top: 45%; left: 40%; animation: floatItem 3.0s ease-in-out infinite 0.8s; }
        .bubble-in { top: 52%; left: 56%; animation: floatItem 3.8s ease-in-out infinite 1.2s; }
        .bubble-yt { top: 59%; left: 42%; animation: floatItem 3.4s ease-in-out infinite 0.6s; }
        .bubble-tg { top: 66%; left: 57%; animation: floatItem 3.5s ease-in-out infinite 1.0s; }
        .bubble-wa { top: 73%; left: 48%; animation: floatItem 3.1s ease-in-out infinite 0.2s; }

        @keyframes floatItem {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        /* Footer Banner */
        .footer-banner {
            position: relative;
            width: 100%;
            padding: 15px 20px 28px 20px;
            background: linear-gradient(to top, rgba(1, 10, 5, 0.98) 75%, transparent 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 25;
        }

        .footer-banner h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.55rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 25%, #4ade80 70%, #facc15 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
        }

        .footer-banner p {
            font-size: 0.85rem;
            color: #cbd5e1;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Mobile adaptation */
        @media (max-width: 480px) {
            .profile-card { height: 100vh; max-height: 100vh; border-radius: 0; border: none; }
            .brand-header { top: 16px; padding: 4px 14px 4px 4px; }
            .brand-header h1 { font-size: 0.85rem; letter-spacing: 1.5px; }
            .profile-pic { width: 36px; height: 36px; }
            .social-bubble { width: 38px; height: 38px; }
            .footer-banner h2 { font-size: 1.3rem; }
            .footer-banner p { font-size: 0.75rem; letter-spacing: 3px; }
        }
    </style>
