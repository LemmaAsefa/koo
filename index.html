<head>
    <meta charset="UTF-8">

    <!-- Google Fonts: Cinzel and Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #022c22 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 100vh;
            background: url('my.jpg') no-repeat center center;
            background-size: contain;
            display: flex;
            justify-content: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        /* Header: Profile picture with gold border and compact name */
        .brand-overlay {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            display: inline-flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(234, 179, 8, 0.6);
            border-radius: 50px;
            padding: 5px 14px 5px 5px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            animation: headerGlow 3s ease-in-out infinite alternate;
        }

        .profile-pic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #eab308;
            object-fit: cover;
            margin-right: 10px;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.8);
        }

        .brand-overlay h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        @keyframes headerGlow {
            0% { border-color: rgba(234, 179, 8, 0.4); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
            100% { border-color: rgba(234, 179, 8, 0.9); box-shadow: 0 10px 30px rgba(234, 179, 8, 0.3); }
        }

        /* Plant Text Animation Overlay */
        .plant-text-overlay {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            text-align: center;
            pointer-events: none;
            overflow: hidden;
            white-space: nowrap;
        }

        .plant-text-overlay h2 {
            display: inline-block;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(90deg, #22c55e, #10b981, #facc15, #22c55e);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            animation: biqiltuuFlow 6s linear infinite, waveMotion 2.5s ease-in-out infinite alternate;
        }

        @keyframes biqiltuuFlow {
            0% { background-position: 0% center; transform: translateX(-30px); }
            50% { transform: translateX(0px); }
            100% { background-position: 200% center; transform: translateX(30px); }
        }

        @keyframes waveMotion {
            0% { transform: translateY(0px) rotate(-1deg); }
            100% { transform: translateY(-8px) rotate(1deg); }
        }

        /* Social Media Icons (Visible, Clickable & Dripping Effect) */
        .social-link {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            border: 1.5px solid rgba(234, 179, 8, 0.5);
            transition: all 0.3s ease;
            animation: dripAnimation 4s ease-in-out infinite alternate;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .social-link svg {
            width: 65%;
            height: 65%;
            object-fit: contain;
        }

        .social-link:hover {
            background-color: rgba(234, 179, 8, 0.4);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.9);
            border: 1.5px solid #eab308;
            transform: scale(1.25);
        }

        @keyframes dripAnimation {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(10px) scale(1.05); }
            100% { transform: translateY(-4px) scale(0.95); }
        }

        /* Precise Social Media Icon Positioning */
        .fb { top: 31%; left: 56%; width: 7.5%; height: 7%; animation-delay: 0.1s; }
        .ig { top: 38%; left: 60%; width: 7.5%; height: 7%; animation-delay: 0.4s; }
        .tiktok { top: 43%; left: 54%; width: 7.5%; height: 7%; animation-delay: 0.7s; }
        .linkedin { top: 50%; left: 58%; width: 7.5%; height: 7%; animation-delay: 1.0s; }
        .youtube { top: 56%; left: 53%; width: 7.5%; height: 7%; animation-delay: 1.3s; }
        .telegram { top: 55%; left: 60%; width: 7.5%; height: 7%; animation-delay: 1.6s; }
        .whatsapp { top: 62%; left: 55%; width: 8.5%; height: 7.5%; animation-delay: 1.9s; }

        @media (min-width: 768px) {
            .wrapper {
                max-width: 520px;
                max-height: 96vh;
                border-radius: 20px;
                border: 2px solid rgba(234, 179, 8, 0.25);
            }
        }
    </style>
</head>
