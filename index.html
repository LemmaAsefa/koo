<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemma Asefa - Grow With Digitalization</title>
    <!-- Google Fonts: Cinzel & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #061a14 0%, #030d09 60%, #010504 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Screen Wrapper Card */
        .profile-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 880px;
            background: linear-gradient(180deg, #091c14 0%, #040e0a 50%, #020705 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(16, 185, 129, 0.1);
            overflow: hidden;
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 20px;
        }

        /* Header / Profile Badge (Lemma Asefa) */
        .brand-header {
            position: absolute;
            top: 25px;
            z-index: 20;
            display: flex;
            align-items: center;
            background: rgba(6, 26, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(234, 179, 8, 0.5);
            border-radius: 50px;
            padding: 6px 18px 6px 6px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        .profile-pic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #eab308;
            object-fit: cover;
            margin-right: 12px;
        }

        .brand-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Main SVG Graphics Stage */
        .graphics-stage {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 50px;
        }

        .main-svg-art {
            width: 100%;
            height: 100%;
            max-height: 520px;
        }

        /* Clickable Social Media Bubbles */
        .social-bubble {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(8, 24, 18, 0.92);
            border: 1.5px solid rgba(234, 179, 8, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.7);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            z-index: 10;
        }

        .social-bubble svg {
            width: 52%;
            height: 52%;
            transition: transform 0.3s ease;
        }

        .social-bubble:hover {
            transform: scale(1.2) translateY(-3px);
            border-color: #facc15;
            background: rgba(234, 179, 8, 0.25);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.8);
        }

        .social-bubble:hover svg {
            transform: scale(1.1);
        }

        /* Coordinates along the pouring flow stream */
        .bubble-fb { top: 29%; left: 41%; animation: floatItem 3.2s ease-in-out infinite; }
        .bubble-ig { top: 36%; left: 54%; animation: floatItem 3.6s ease-in-out infinite 0.4s; }
        .bubble-tk { top: 43%; left: 44%; animation: floatItem 3.0s ease-in-out infinite 0.8s; }
        .bubble-in { top: 50%; left: 53%; animation: floatItem 3.8s ease-in-out infinite 1.2s; }
        .bubble-yt { top: 57%; left: 46%; animation: floatItem 3.4s ease-in-out infinite 0.6s; }
        .bubble-tg { top: 64%; left: 55%; animation: floatItem 3.5s ease-in-out infinite 1.0s; }
        .bubble-wa { top: 71%; left: 50%; animation: floatItem 3.1s ease-in-out infinite 0.2s; }

        @keyframes floatItem {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        /* Footer Banner (Grow With Digitalization) */
        .footer-banner {
            position: relative;
            width: 100%;
            padding: 20px 20px 30px 20px;
            background: linear-gradient(to top, #020705 70%, transparent 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 15;
        }

        .footer-banner h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 30%, #4ade80 70%, #facc15 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
        }

        .footer-banner p {
            font-size: 0.85rem;
            color: #cbd5e1;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Responsive Mobile Scaling */
        @media (max-width: 480px) {
            .profile-card { height: 100vh; max-height: 100vh; border-radius: 0; border: none; }
            .brand-header { top: 15px; padding: 4px 14px 4px 4px; }
            .brand-header h1 { font-size: 0.85rem; letter-spacing: 1.5px; }
            .profile-pic { width: 32px; height: 32px; }
            .social-bubble { width: 38px; height: 38px; }
            .footer-banner h2 { font-size: 1.25rem; }
            .footer-banner p { font-size: 0.75rem; letter-spacing: 3px; }
        }
    </style>
</head>
