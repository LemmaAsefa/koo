<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lemma Asefa</title>
    <!-- Fontootni ammayyaa -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #022c22 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .wrapper {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 100vh;
            background: url('my.jpg') no-repeat center center;
            background-size: contain;
            display: flex;
            justify-content: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        /* Header: LEMMA ASEFA qofa qubee gurguddaan (Gold & Glassmorphism) */
        .brand-overlay {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            text-align: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(234, 179, 8, 0.6);
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            animation: headerGlow 3s ease-in-out infinite alternate;
        }

        .brand-overlay h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @keyframes headerGlow {
            0% { border-color: rgba(234, 179, 8, 0.4); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
            100% { border-color: rgba(234, 179, 8, 0.9); box-shadow: 0 10px 30px rgba(234, 179, 8, 0.3); }
        }

        /* Biqiltuu lafaa ol biqilaa jiru fakkaatee bitaa gara mirgaatti sossochu */
        .plant-text-overlay {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            text-align: center;
            pointer-events: none;
            overflow: hidden;
            white-space: nowrap;
        }

        .plant-text-overlay h2 {
            display: inline-block;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(90deg, #22c55e, #10b981, #facc15, #22c55e);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            animation: biqiltuuFlow 6s linear infinite, waveMotion 2.5s ease-in-out infinite alternate;
        }

        @keyframes biqiltuuFlow {
            0% { background-position: 0% center; transform: translateX(-30px); }
            50% { transform: translateX(0px); }
            100% { background-position: 200% center; transform: translateX(30px); }
        }

        @keyframes waveMotion {
            0% { transform: translateY(0px) rotate(-1deg); }
            100% { transform: translateY(-8px) rotate(1deg); }
        }

        /* Social Media Links - Gad dhangala'anii akka sossochan (Dripping & Floating Effect) */
        .social-link {
            position: absolute;
            display: block;
            border-radius: 50%;
            transition: all 0.3s ease;
            animation: dripAnimation 4s ease-in-out infinite alternate;
        }

        .social-link:hover {
            background-color: rgba(234, 179, 8, 0.4);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.9);
            border: 2px solid #eab308;
            transform: scale(1.2);
        }

        @keyframes dripAnimation {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(12px) scale(1.05); }
            100% { transform: translateY(-5px) scale(0.95); }
        }

        /* Safartoota iconootaa hundaaf (Telegram dabaluun iddoonsaa qindaa'era) */
        .fb { top: 43%; left: 63%; width: 9%; height: 8%; animation-delay: 0.1s; }
        .ig { top: 52%; left: 67%; width: 9%; height: 8%; animation-delay: 0.5s; }
        .tiktok { top: 59%; left: 61%; width: 9%; height: 8%; animation-delay: 0.9s; }
        .linkedin { top: 66%; left: 66%; width: 9%; height: 8%; animation-delay: 1.3s; }
        .youtube { top: 73%; left: 60%; width: 9%; height: 8%; animation-delay: 1.7s; }
        .telegram { top: 73%; left: 70%; width: 9%; height: 8%; animation-delay: 2.1s; }
        .whatsapp { top: 82%; left: 63%; width: 10%; height: 9%; animation-delay: 2.5s; }

        @media (min-width: 768px) {
            .wrapper {
                max-width: 520px;
                max-height: 96vh;
                border-radius: 20px;
                border: 2px solid rgba(234, 179, 8, 0.25);
            }
        }
    </style>
</head>
<body>

        <div class="plant-text-overlay">
            <h2>🌱 GROW WITH DIGITALIZATION 🌿</h2>
        </div>

        <!-- Social Media Links (Dripping/Sossochoo) -->

        <a href="https://www.tiktok.com/@lemma.official5?_r=1&_t=ZS-99lKBBG9gcX" target="_blank" class="social-link tiktok" title="TikTok"></a>
        <a href="https://www.linkedin.com/in/lemma-asefa-b9814842a?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" class="social-link linkedin" title="LinkedIn"></a>
        <a href="https://www.youtube.com/@lemmaasefa-09asefalemma.official" target="_blank" class="social-link youtube" title="YouTube"></a>
        <a href="https://t.me/LemmaA9" target="_blank" class="social-link telegram" title="Telegram"></a>
        <a href="https://wa.me/251909506573" target="_blank" class="social-link whatsapp" title="WhatsApp"></a>
    </div>

</body>
</html>
