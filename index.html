<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow With Digitalization - Qaroo Digital Agency</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Graphic Container: Warm, soft-focus background inspired by your design */
        .promo-graphic {
            position: relative;
            width: 600px;
            height: 750px;
            background: linear-gradient(135deg, #fceade 0%, #f4d0ba 100%);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 35px 40px;
            text-align: center;
        }

        /* Ambient soft-focus background blur effect */
        .promo-graphic::before {
            content: '';
            position: absolute;
            top: -40px;
            left: -40px;
            width: 280px;
            height: 280px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            filter: blur(45px);
            z-index: 1;
        }

        /* Visual Stage */
        .visual-stage {
            position: relative;
            z-index: 2;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* The Watering Cup Section */
        .element-cup-container {
            align-self: flex-start;
            margin-left: 10px;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 4px solid #b58352;
            text-align: left;
            max-width: 280px;
        }

        .element-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #b58352;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .element-desc {
            font-size: 0.75rem;
            color: #4a3525;
            line-height: 1.3;
        }

        /* Clickable Social Media Icon Blocks Stream */
        .element-icons-stream {
            display: flex;
            gap: 12px;
            margin: 10px 0;
        }

        .icon-block {
            width: 45px;
            height: 45px;
            background: #ffffff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
            font-size: 0.8rem;
            font-weight: bold;
            color: #b58352;
            border: 1px solid rgba(181, 131, 82, 0.3);
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .icon-block:hover {
            transform: translateY(-4px);
            background: #b58352;
            color: #ffffff;
        }

        /* The Sprouting Plant Section */
        .element-plant-container {
            align-self: flex-end;
            margin-right: 10px;
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-right: 4px solid #4e9f3d;
            text-align: right;
            max-width: 280px;
        }

        .element-title-plant {
            font-size: 0.8rem;
            font-weight: 700;
            color: #2e6930;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        /* Text and Branding Footer */
        .branding-footer {
            position: relative;
            z-index: 2;
            border-top: 2px solid rgba(181, 131, 82, 0.25);
            padding-top: 15px;
        }

        .main-slogan {
            font-size: 1.65rem;
            font-weight: 800;
            color: #d4af37; /* Bold, gold lettering */
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
            margin-bottom: 6px;
        }

        .portfolio-owner {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a3525;
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }
    </style>
</head>
<body>

    <div class="promo-graphic">
        <!-- Visual Elements Stage -->
        <div class="visual-stage">
            
            <!-- 1. The Watering Cup -->
            <div class="element-cup-container">
                <div class="element-title">The Watering Cup</div>
                <div class="element-desc">Hand tilting a white ceramic cup, pouring marketing strategies into the business.</div>
            </div>

            <!-- 2. Clickable Social Media Icon Blocks (As requested, fully linked!) -->
            <div class="element-icons-stream">
                <!-- Bakka "https://your-link..." jedhutti linkii kee galchi -->
                <a href="https://facebook.com" target="_blank" class="icon-block" title="Facebook">FB</a>
                <a href="https://instagram.com" target="_blank" class="icon-block" title="Instagram">IG</a>
                <a href="https://linkedin.com" target="_blank" class="icon-block" title="LinkedIn">IN</a>
                <a href="https://tiktok.com" target="_blank" class="icon-block" title="TikTok">TT</a>
                <a href="https://whatsapp.com" target="_blank" class="icon-block" title="WhatsApp">WA</a>
            </div>

            <!-- 3. The Sprouting Plant -->
            <div class="element-plant-container">
                <div class="element-title-plant">The Sprouting Plant</div>
                <div class="element-desc">Vibrant green plant growing from rich soil, fueled directly by social media streams.</div>
            </div>

        </div>

        <!-- Text and Branding Footer -->
        <div class="branding-footer">
            <div class="main-slogan">GROW WITH DIGITALIZATION</div>
            <div class="portfolio-owner">Lemma Asefa Portfolio</div>
        </div>
    </div>

</body>
</html>
