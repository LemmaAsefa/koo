    <!-- Google Fonts: Cinzel & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0f2d22 0%, #061912 50%, #020b07 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Screen Wrapper Card with Magical Nature Backdrop */
        .profile-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 900px;
            background: linear-gradient(180deg, rgba(8, 38, 27, 0.95) 0%, rgba(4, 20, 14, 0.98) 50%, rgba(2, 10, 7, 1) 100%),
                        radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.15) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.95), 0 0 50px rgba(34, 197, 94, 0.15);
            overflow: hidden;
            border: 1px solid rgba(234, 179, 8, 0.35);
            border-radius: 24px;
        }

        /* Header / Profile Badge */
        .brand-header {
            position: absolute;
            top: 22px;
            z-index: 25;
            display: flex;
            align-items: center;
            background: rgba(6, 26, 20, 0.9);
            backdrop-filter: blur(12px);
            border: 1.5px solid rgba(234, 179, 8, 0.6);
            border-radius: 50px;
            padding: 6px 20px 6px 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #eab308;
            object-fit: cover;
            margin-right: 12px;
        }

        .brand-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Main Graphics Stage */
        .graphics-stage {
            position: relative;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 45px;
        }

        .main-svg-art {
            width: 100%;
            height: 100%;
            max-height: 560px;
        }

        /* Clickable Social Media Bubbles */
        .social-bubble {
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(6, 22, 16, 0.95);
            border: 1.5px solid rgba(234, 179, 8, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            z-index: 20;
        }

        .social-bubble svg {
            width: 52%;
            height: 52%;
            transition: transform 0.3s ease;
        }

        .social-bubble:hover {
            transform: scale(1.25) translateY(-3px);
            border-color: #facc15;
            background: rgba(234, 179, 8, 0.3);
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.9);
        }

        .social-bubble:hover svg {
            transform: scale(1.1);
        }

        /* Precise coordinates along the natural pouring stream */
        .bubble-fb { top: 30%; left: 39%; animation: floatItem 3.2s ease-in-out infinite; }
        .bubble-ig { top: 37%; left: 55%; animation: floatItem 3.6s ease-in-out infinite 0.4s; }
        .bubble-tk { top: 44%; left: 42%; animation: floatItem 3.0s ease-in-out infinite 0.8s; }
        .bubble-in { top: 51%; left: 54%; animation: floatItem 3.8s ease-in-out infinite 1.2s; }
        .bubble-yt { top: 58%; left: 44%; animation: floatItem 3.4s ease-in-out infinite 0.6s; }
        .bubble-tg { top: 65%; left: 56%; animation: floatItem 3.5s ease-in-out infinite 1.0s; }
        .bubble-wa { top: 72%; left: 49%; animation: floatItem 3.1s ease-in-out infinite 0.2s; }

        @keyframes floatItem {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        /* Footer Banner */
        .footer-banner {
            position: relative;
            width: 100%;
            padding: 15px 20px 25px 20px;
            background: linear-gradient(to top, rgba(2, 10, 7, 0.95) 70%, transparent 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 20;
        }

        .footer-banner h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 30%, #4ade80 70%, #facc15 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8));
        }

        .footer-banner p {
            font-size: 0.85rem;
            color: #cbd5e1;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Responsive Mobile Scaling */
        @media (max-width: 480px) {
            .profile-card { height: 100vh; max-height: 100vh; border-radius: 0; border: none; }
            .brand-header { top: 15px; padding: 4px 14px 4px 4px; }
            .brand-header h1 { font-size: 0.85rem; letter-spacing: 1.5px; }
            .profile-pic { width: 34px; height: 34px; }
            .social-bubble { width: 38px; height: 38px; }
            .footer-banner h2 { font-size: 1.25rem; }
            .footer-banner p { font-size: 0.75rem; letter-spacing: 3px; }
